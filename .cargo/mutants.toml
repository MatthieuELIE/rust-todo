exclude_re = [
    # CONTROL and ALT are disjoint flags: `^` gives the same set as `|`.
    'src/editor\.rs:73:71: replace \| with \^ in Editor::handle_key',
    # Delete at the end of the text runs remove(len, len + 1), whose bounds both map to the text's byte length: nothing is erased.
    'src/editor\.rs:194:32: replace match guard self\.cursor < len with true in Editor::insert',
    'src/editor\.rs:194:44: replace < with <= in Editor::insert',
    # A key that is not a character does nothing in normal mode, so falling through after `f` only clamps a cursor already on the text.
    'src/editor/normal\.rs:19:13: delete match arm \(Some\(_\), _\) in Editor::normal',
]
