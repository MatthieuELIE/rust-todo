exclude_re = [
    # CONTROL and ALT are disjoint flags: `^` gives the same set as `|`.
    'src/editor\.rs:80:71: replace \| with \^ in Editor::handle_key',
    'src/editor/visual\.rs:10:59: replace \| with \^ in Editor::visual',
    # Delete at the end of the text runs remove(len, len + 1), whose bounds both map to the text's byte length: nothing is erased.
    'src/editor\.rs:219:32: replace match guard self\.cursor < len with true in Editor::insert',
    'src/editor\.rs:219:44: replace < with <= in Editor::insert',
    # A key that is not a character does nothing in normal mode, so falling through after `f` only clamps a cursor already on the text.
    'src/editor/normal\.rs:20:13: delete match arm \(Some\(_\), _\) in Editor::normal',
    # `pending` is only d, c, y or p: the arm above takes the first three and handle_key stops a `v` after `p`, so `v` arrives here with nothing pending.
    'src/editor/normal\.rs:68:35: replace match guard pending\.is_none\(\) with true in Editor::normal',
    # Without group or other bits, the extra set_permissions(mode & 0o700) can drop only setuid, setgid and sticky: the write clears the first two, the last does nothing on a regular file.
    'src/repository\.rs:92:13: replace & with [|^] in append',
    # RAPID_BLINK and HIDDEN are disjoint flags: `^` gives the same set as `|`.
    'src/view/popup\.rs:44:72: replace \| with \^ in draw_popup',
    # `today` only changes the colours of the words, not their width, so the text wraps onto as many rows.
    'src/view/details\.rs:21:31: delete ! in details_height',
    # The help opens from the popup only with the date picker open or in normal or visual mode, so no popup in insert mode is under it.
    'src/view/help\.rs:165:32: replace match guard popup\.editor\.mode == Mode::Insert with false in opened_from',
    # A priority is a letter from A to E, so the index is at most 4 and the bound never applies.
    'src/view/style\.rs:79:96: replace - with [+/] in priority',
    # CONTROL and ALT are disjoint flags: `^` gives the same set as `|`.
    'src/tui\.rs:215:63: replace \| with \^ in App::apply',
    'src/tui/help\.rs:18:65: replace \| with \^ in App::help_key',
    'src/tui/popup\.rs:(32:64|42:69): replace \| with \^ in App::popup_key',
]
