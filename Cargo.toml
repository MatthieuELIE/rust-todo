[package]
name = "todo"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
time = { version = "0.3.55", features = ["parsing", "macros", "local-offset"] }
